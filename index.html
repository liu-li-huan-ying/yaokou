<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>窑口 · 配釉台</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="app">
      <section class="stage">
        <canvas id="patch" width="320" height="320" aria-label="釉色预览"></canvas>
        <dl id="readout"></dl>
      </section>
      <section class="controls">
        <h2>釉料</h2>
        <div id="recipe"></div>
        <h2>烧成曲线</h2>
        <div id="curve"></div>
        <h2>窑位</h2>
        <div id="offset"></div>
        <h2>目标釉色</h2>
        <div id="targets"></div>
        <div class="row">
          <button id="solve" type="button">反推配方</button>
          <button id="reset" type="button">复位</button>
        </div>
        <p class="note">
          呈色为自洽的虚构化学，不声称复原真实工艺。运行时不联网，无外部字体。
        </p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
